name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

concurrency:
  group: zotero-alert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore sent-paper history
        uses: actions/cache/restore@v4
        with:
          path: .cache/alert-history.json
          key: paper-alert-history-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            paper-alert-history-v1-${{ github.ref_name }}-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf '%s\n' "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          uv run src/zotero_arxiv_daily/main.py executor.history_path=.cache/alert-history.json

      - name: Save sent-paper history after successful delivery
        uses: actions/cache/save@v4
        with:
          path: .cache/alert-history.json
          key: paper-alert-history-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
