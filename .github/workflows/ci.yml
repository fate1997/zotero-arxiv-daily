name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025  # SMTP
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Start embedding and LLM test server
        run: |
          docker build -t zotero-mock-openai tests/utils/mock_openai
          docker run -d -p 127.0.0.1:30000:30000 zotero-mock-openai
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://localhost:30000/docs > /dev/null

      - name: Run Pytest
        env:
          ZOTERO_ID: "0"
          ZOTERO_KEY: "AbCdEfGhIjKlMnOpQrStUvWx"
          SENDER: "test@example.com"
          RECEIVER: "test@example.com"
          SENDER_PASSWORD: "test"
          OPENAI_API_KEY: "sk-xxx"
          OPENAI_API_BASE: "http://localhost:30000/v1"
        run: |
          uv run pytest --run-integration
