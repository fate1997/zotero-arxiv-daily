name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025  # SMTP
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Start embedding and LLM test server
        run: |
          docker build -t zotero-mock-openai tests/utils/mock_openai
          docker run -d --name zotero-mock-openai -p 127.0.0.1:30000:30000 zotero-mock-openai
          # Docker can accept a connection before Uvicorn is listening, then reset it.
          # Retry transport failures as well as HTTP errors, with a bounded wait.
          if ! curl --retry 30 --retry-delay 1 --retry-all-errors --retry-max-time 60 \
            --connect-timeout 2 --max-time 3 --fail --silent --show-error \
            http://127.0.0.1:30000/health > /dev/null; then
            docker logs zotero-mock-openai
            exit 1
          fi

      - name: Run Pytest
        env:
          ZOTERO_ID: "0"
          ZOTERO_KEY: "AbCdEfGhIjKlMnOpQrStUvWx"
          SENDER: "test@example.com"
          RECEIVER: "test@example.com"
          SENDER_PASSWORD: "test"
          OPENAI_API_KEY: "sk-xxx"
          OPENAI_API_BASE: "http://localhost:30000/v1"
        run: |
          uv run --locked pytest --run-integration

      - name: Show test server logs on failure
        if: failure()
        run: docker logs zotero-mock-openai
